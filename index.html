<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 3D Particle Magic - Hand Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #050510;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        canvas { display: block; }

        /* === LOADING === */
        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #050510;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 20px;
        }
        .loader {
            width: 60px; height: 60px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #ff4488;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status-text {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
        }
        .status-ready { color: #00ff88 !important; }
        .status-error { color: #ff4444 !important; }

        /* === VIDEO PREVIEW === */
        #video-input {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 180px;
            height: 135px;
            z-index: 100;
            opacity: 0.7;
            transform: scaleX(-1);
            border-radius: 16px;
            border: 2px solid rgba(255,68,136,0.4);
            box-shadow: 0 0 30px rgba(255,68,136,0.15);
            transition: all 0.3s ease;
            object-fit: cover;
        }
        #video-input:hover {
            opacity: 1;
            transform: scaleX(-1) scale(1.05);
            border-color: rgba(255,68,136,0.8);
        }

        /* === GESTURE DISPLAY (TOP CENTER) === */
        #gesture-display {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10,10,30,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 28px;
            border-radius: 50px;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s ease;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        .g-icon { font-size: 24px; }
        .g-name { font-size: 14px; font-weight: 500; letter-spacing: 0.3px; }

        /* === FPS COUNTER === */
        #fps-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(10,10,30,0.6);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 20px;
            z-index: 100;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        #fps-counter { color: #0f0; font-weight: bold; }

        /* === TEXT INPUT (BOTTOM CENTER) - BOMBA! === */
        #input-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        #text-input {
            width: 340px;
            padding: 14px 24px;
            background: rgba(10,10,30,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255,68,136,0.3);
            border-radius: 50px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            outline: none;
            transition: all 0.4s ease;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
        }
        #text-input::placeholder {
            color: rgba(255,255,255,0.3);
            font-weight: 300;
        }
        #text-input:focus {
            border-color: rgba(0,255,136,0.6);
            box-shadow: 0 0 40px rgba(0,255,136,0.15), 0 4px 30px rgba(0,0,0,0.4);
        }
        #input-hint {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        /* === INSTRUCTIONS (BOTTOM LEFT) === */
        #instructions {
            position: fixed;
            bottom: 100px;
            left: 20px;
            z-index: 100;
            padding: 16px 20px;
            background: rgba(10,10,30,0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            max-width: 280px;
            transition: opacity 0.3s;
        }
        #instructions h3 {
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #ff4488;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .gesture-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .gesture-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .gesture-item:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(2px);
        }
        .gesture-item .icon { font-size: 16px; }
        .gesture-item .text { font-size: 10px; opacity: 0.8; }

        /* Highlight the peace gesture item */
        .gesture-item.highlight {
            border: 1px solid rgba(0,255,136,0.3);
            background: rgba(0,255,136,0.05);
        }

        /* === WATERMARK === */
        .watermark {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.15);
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <!-- Loading -->
    <div id="loading">
        <div class="loader"></div>
        <div id="status-text">AI model yuklanmoqda...</div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Camera Video -->
    <video id="video-input" autoplay playsinline></video>

    <!-- Gesture Display -->
    <div id="gesture-display">
        <span class="g-icon">👋</span>
        <span class="g-name">Qo'lingizni ko'rsating</span>
    </div>

    <!-- FPS -->
    <div id="fps-box">FPS: <span id="fps-counter">--</span></div>

    <!-- TEXT INPUT - Bomba yangi feature! -->
    <div id="input-container">
        <input type="text" id="text-input" placeholder="✍️ Matn yozing... keyin ✌️ ko'rsating" maxlength="30" autocomplete="off" spellcheck="false">
        <div id="input-hint">Matn yozing va ✌️ ko'rsating</div>
    </div>

    <!-- Instructions -->
    <div id="instructions">
        <h3>🎮 Qo'l ishoralari</h3>
        <div class="gesture-list">
            <div class="gesture-item"><span class="icon">🖐️</span><span class="text">Ochiq → Suyuqlik</span></div>
            <div class="gesture-item"><span class="icon">🤏</span><span class="text">Qisish → Matnlar</span></div>
            <div class="gesture-item"><span class="icon">✊</span><span class="text">Musht → Portlash</span></div>
            <div class="gesture-item highlight"><span class="icon">✌️</span><span class="text">Peace → Matn!</span></div>
            <div class="gesture-item"><span class="icon">👍</span><span class="text">Super → Yurak</span></div>
            <div class="gesture-item"><span class="icon">☝️</span><span class="text">Ko'rsatish → Yulduz</span></div>
            <div class="gesture-item"><span class="icon">🤘</span><span class="text">Rock → Galaktika</span></div>
            <div class="gesture-item"><span class="icon">🖖</span><span class="text">To'rtta → Kapalak</span></div>
        </div>
    </div>

    <!-- Watermark -->
    <div class="watermark">KUAF × SysMasters</div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
